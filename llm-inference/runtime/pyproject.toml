[project]
name = "qedge-runtime"
version = "0.1.0"
description = "QEdge real-model reference runtime"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.2.0",
    "transformers>=4.42.0",
    "safetensors>=0.4.0",
    "huggingface-hub>=0.23.0",
    "gguf>=0.19.0",
    "llama-cpp-python>=0.3.36",
    "sentencepiece>=0.2.0",
    "qedge-common",
]

[project.optional-dependencies]
onnx = ["onnx>=1.17", "onnxruntime>=1.20"]

[tool.uv.sources]
qedge-common = { path = "../../qedge-common", editable = true }

[project.scripts]
qedge-runtime = "qedge_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qedge_runtime"]

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "tests/",
    "README.md",
    "pyproject.toml",
]
